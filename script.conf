# Las lineas que empiezan con # son comentarios y se ignoran.
# Umbral de RAM en MB a partir del cual el indicador se pone rojo, valor predeterminado=7.
limiteRAM=7
# Intervalo de actualizacion de la pestaña en milisegundos, valor predeterminado=1.
intervalo=1
# Cambia entre mostrar el simbolo del estado, la cantidad de RAM, ambos o ninguno.
# Opciones: simbolo, numerico, ambos u oculto.
modoVisual=ambos
# Enviar Ctrl al entrar en rojo.
# Opciones: true o false.
enviarCtrl=true
# Mostrar notificaciones de Windows al entrar en rojo.
# Opciones: true o false.
notificacionesWindows=true
# Titulo y mensaje personalizados para la notificacion.
tituloNotificacion=Monitor RAM - rojo
mensajeNotificacion=El proceso se ha iniciado.
# Combinacion de teclas al entrar en rojo, por ejemplo alt+tab o ctrl+alt+m.
# Dejala vacia para desactivarla. Modificadores: ctrl, alt, shift, win.
macroRojo=
# Activar o desactivar la macro.
# Opciones: true o false.
macrosActivas=false

